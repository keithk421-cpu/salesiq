# Keith Sales Copilot - HELP evals (promptfoo 0.123.1, pinned in package.json script).
# Run: SALES_COPILOT_ANTHROPIC_KEY=... npm run eval:promptfoo
# Level 1 (javascript) is a hard gate. Level 2 (llm-rubric) is the quality threshold.
# Level 3 = Keith-approved scenarios only (golden_approved: true); drafts never gate.
description: HELP card - Sonnet 5.5 vs Opus 5.5 on the same scenarios
prompts:
  - '{{scenario_id}}'
providers:
  - id: file://dist-tools/promptfoo-provider.mjs
    label: sonnet-5-5
    config: { model: claude-sonnet-5-5 }
  - id: file://dist-tools/promptfoo-provider.mjs
    label: opus-5-5
    config: { model: claude-opus-5-5 }
defaultTest:
  options:
    provider: anthropic:messages:claude-opus-5-5
tests: file://dist-tools/promptfoo-tests.mjs
evaluateOptions:
  maxConcurrency: 1
