name: M0 build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - name: Rust unit tests + Windows target check
        working-directory: native/windows-audio
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo test
          cargo check --target x86_64-pc-windows-msvc

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build native WASAPI module (fails if missing)
        run: npm run build:native
      - name: Native smoke test
        run: node scripts/native-smoke.cjs
      - run: npm run typecheck
      - run: npm test
      - name: Package installer
        run: npm run package:win
      - name: Verify the audio module is inside the installer payload
        shell: pwsh
        run: |
          if (-not (Test-Path release/win-unpacked/resources/sales-copilot-audio.node)) { Write-Error "audio module missing from package"; exit 1 }
          Get-ChildItem release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SalesCopilot-M0-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
