name: M0 build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: m0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        # Compare with the commit whose installer is on the "Latest build" release (the `latest` tag is
        # moved there on publish), not with the previous push: a cancelled or failed build is then
        # rebuilt by the next push even if that push only changes docs.
        run: |
          git fetch --force origin 'refs/tags/latest:refs/tags/latest' 2>/dev/null || true
          base=$(git rev-parse -q --verify 'refs/tags/latest^{commit}' || true)
          if [ -z "$base" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! git diff --no-renames --name-only "$base" "${{ github.sha }}" > "$RUNNER_TEMP/changed.txt"; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if grep -qvE '^(docs/|evals/reports/|README\.md|THIRD_PARTY_NOTICES\.md|[A-Z_]+\.md$)' "$RUNNER_TEMP/changed.txt"; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - name: Rust unit tests + Windows target check
        working-directory: native/windows-audio
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo test
          cargo check --target x86_64-pc-windows-msvc

  windows:
    name: Windows build + installer
    runs-on: windows-latest
    # Docs-only pushes skip the (slower, larger) Windows build; tests above still run on every push.
    if: github.event_name != 'push' || needs.changes.outputs.code == 'true'
    needs: changes
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build native WASAPI module (fails if missing)
        run: npm run build:native
      - name: Native smoke test
        run: node scripts/native-smoke.cjs
      - run: npm run typecheck
      - run: npm test
      - name: Package installer
        run: npm run package:win
      - name: Verify the audio module is inside the installer payload
        shell: pwsh
        run: |
          if (-not (Test-Path release/win-unpacked/resources/sales-copilot-audio.node)) { Write-Error "audio module missing from package"; exit 1 }
          Get-ChildItem release/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: SalesCopilot-M0-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          # Short: the "Latest build" release below is the place to download from (and doesn't count
          # against the small artifact storage quota private repos have).
          retention-days: 3
      - name: Publish to the "Latest build" release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Newest Windows installer. Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}) from ${GITHUB_REF_NAME}, $(date -u +%F). Download the .exe below and run it."
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "$notes"
          gh release upload latest release/*.exe --clobber
          gh release edit latest --notes "$notes" --title "Latest build"
          # Mark which commit the published installer was built from (the "What changed" job compares with it).
          git push --force origin "${GITHUB_SHA}:refs/tags/latest"
